name: Build and deploy Next.js app to Azure Web App - cvgenie

on:
  push:
    branches:
      - sub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and generate Prisma
        run: |
          cd client
          npm install
          # Create a dummy .env file with placeholder DATABASE_URL for Prisma generation
          echo "DATABASE_URL='postgresql://dummy:dummy@localhost:5432/dummy'" > .env
          echo "DIRECT_URL='postgresql://dummy:dummy@localhost:5432/dummy'" >> .env
          npx prisma generate

      - name: Build application
        run: |
          cd client
          # Build with dummy database URL - Azure will provide the real one
          npm run build
        env:
          # Provide dummy environment variables for the build process
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Prepare deployment package
        run: |
          mkdir deployment
          cp -r client/.next deployment/
          cp -r client/public deployment/
          cp -r client/node_modules deployment/
          cp client/package.json deployment/
          cp client/next.config.js deployment/ || true
          mkdir -p deployment/prisma
          cp client/prisma/schema.prisma deployment/prisma/
          
          # Create a production startup script
          echo "#!/bin/bash" > deployment/start.sh
          echo "cd /home/site/wwwroot" >> deployment/start.sh
          echo "npx prisma generate" >> deployment/start.sh
          echo "npm start" >> deployment/start.sh
          chmod +x deployment/start.sh
          
          zip -r release.zip deployment

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02329BEA6A474557B57CEE84C9F390A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_059495A5A3A74C59BCF5AA1299A87983 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F09229AF32A041B49D569529FFFA6F7F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cvgenie'
          slot-name: 'Production'
          package: .