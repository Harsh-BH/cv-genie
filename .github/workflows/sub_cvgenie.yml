name: Deploy Next.js to Azure

on:
  push:
    branches: [sub]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:        # ✅ Required for federated Azure login
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install, generate, and build
        run: |
          cd client
          npm ci
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env
          echo "JWT_SECRET=dummy-secret" >> .env
          npx prisma generate
          npm run build

      - name: Validate Build Output
        run: |
          cd client
          echo "=== VALIDATING BUILD OUTPUT ==="
          
          if [ ! -f "package.json" ]; then
            echo "❌ ERROR: package.json not found"
            exit 1
          fi

          if [ ! -d ".next" ]; then
            echo "❌ ERROR: .next directory not found. Build likely failed."
            exit 1
          fi

          echo "✅ Build output is valid"

      - name: Archive app for deployment
        run: |
          cd client
          zip -r ../app.zip . -x "*.git*"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02329BEA6A474557B57CEE84C9F390A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_059495A5A3A74C59BCF5AA1299A87983 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F09229AF32A041B49D569529FFFA6F7F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cvgenie'
          package: app.zip
