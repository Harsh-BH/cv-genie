name: Build and deploy Next.js app to Azure Web App - cvgenie

on:
  push:
    branches:
      - sub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'  # Changed to 20.x for better compatibility

      - name: Setup environment
        run: |
          cd client
          # Create dummy .env file just for build
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env
          echo "DIRECT_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> .env
          echo "JWT_SECRET=dummy-secret-for-build" >> .env

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Generate Prisma client
        run: |
          cd client
          npx prisma generate

      - name: Build application
        run: |
          cd client
          npm run build
        env:
          # Use literal dummy values to ensure build works
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          JWT_SECRET: "dummy-secret-for-build"

      - name: Optimize deployment package
        run: |
          cd client
          
          # Ensure standalone build is properly packaged
          mkdir -p deployment
          cp -r .next/standalone/* deployment/
          mkdir -p deployment/.next/static
          cp -r .next/static deployment/.next/
          cp -r public deployment/
          cp package.json deployment/
          cp next.config.js deployment/ 2>/dev/null || true
          mkdir -p deployment/prisma
          cp prisma/schema.prisma deployment/prisma/
          
          # Create a simplified web.config for Azure
          cat > deployment/web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
              </handlers>
              <rewrite>
                <rules>
                  <rule name="DynamicContent">
                    <match url="/*" />
                    <action type="Rewrite" url="server.js"/>
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: client/deployment

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02329BEA6A474557B57CEE84C9F390A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_059495A5A3A74C59BCF5AA1299A87983 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F09229AF32A041B49D569529FFFA6F7F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cvgenie'
          slot-name: 'Production'
          package: .
          # Use the simpler node command directly - Prisma client is already generated
          startup-command: 'node server.js'