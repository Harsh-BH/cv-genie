name: Deploy Next.js to Azure

on:
  push:
    branches: [sub]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install and build
        run: |
          cd client
          npm ci
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env
          echo "JWT_SECRET=dummy-secret" >> .env
          npx prisma generate
          npm run build

      - name: Package for deployment
        run: |
          cd client
          mkdir -p ../deploy
          # Copy standalone build
          cp -r .next/standalone/* ../deploy/
          # Copy static files
          cp -r .next/static ../deploy/.next/
          cp -r public ../deploy/
          # Copy Prisma
          cp -r node_modules/.prisma ../deploy/node_modules/
          cp -r prisma ../deploy/
          # Create root server.js wrapper
          cat > ../deploy/server.js << 'EOF'
          require('./.next/standalone/server.js')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02329BEA6A474557B57CEE84C9F390A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_059495A5A3A74C59BCF5AA1299A87983 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F09229AF32A041B49D569529FFFA6F7F }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'cvgenie'
          package: .
          startup-command: 'node server.js'