name: Deploy Next.js to Azure

on:
  push:
    branches: [sub]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install and build
        run: |
          cd client
          npm ci
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env
          echo "JWT_SECRET=dummy-secret" >> .env
          npx prisma generate
          npm run build

      - name: Debug build output
        run: |
          cd client
          echo "=== CHECKING BUILD OUTPUT ==="
          ls -la
          echo "=== CHECKING .next FOLDER ==="
          ls -la .next/ || echo ".next folder doesn't exist!"
          echo "=== CHECKING FOR STANDALONE ==="
          ls -la .next/standalone/ || echo "No standalone folder!"
          echo "=== CHECKING next.config.js ==="
          cat next.config.js || echo "No next.config.js found!"

      - name: Package for deployment
        run: |
          cd client
          mkdir -p ../deploy/.next

          # Copy standalone output
          if [ -f ".next/standalone/server.js" ]; then
            echo "Found standalone server, using it"
            cp -r .next/standalone/* ../deploy/
            cp -r .next/standalone/.next ../deploy/.next
            cp -r .next/static ../deploy/.next/static
            cp -r public ../deploy/ 2>/dev/null || true
          else
            echo "ERROR: No standalone build found!"
            echo "Contents of .next folder:"
            find .next -type f | head -10
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .

      - name: Debug deployment package
        run: |
          echo "=== DEPLOYMENT PACKAGE CONTENTS ==="
          ls -la
          echo "=== LOOKING FOR SERVER.JS ==="
          find . -name "server.js" -type f

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02329BEA6A474557B57CEE84C9F390A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_059495A5A3A74C59BCF5AA1299A87983 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F09229AF32A041B49D569529FFFA6F7F }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'cvgenie'
          package: .
          startup-command: 'node server.js'