name: Deploy Next.js to Azure

on:
  push:
    branches: [sub]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install and build
        run: |
          cd client
          npm ci
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env
          echo "JWT_SECRET=dummy-secret" >> .env
          npx prisma generate
          # Ensure next.config.js has standalone output
          if ! grep -q "output.*standalone" next.config.js; then
            echo "Adding standalone output to next.config.js"
            sed -i '/const nextConfig = {/a\  output: "standalone",' next.config.js
          fi
          npm run build

      - name: Package for deployment
        run: |
          cd client
          mkdir -p ../deploy
          
          # Check if standalone build exists
          if [ -d ".next/standalone" ]; then
            echo "Standalone build found - using it"
            cp -r .next/standalone/* ../deploy/
            mkdir -p ../deploy/.next/static
            cp -r .next/static/* ../deploy/.next/static/
            cp -r public/* ../deploy/public/ 2>/dev/null || true
          else
            echo "No standalone build - creating manual deployment"
            # Copy built app
            cp -r .next ../deploy/
            cp -r public ../deploy/
            cp package*.json ../deploy/
            cp -r node_modules ../deploy/
            cp -r prisma ../deploy/
            # Create server.js
            cat > ../deploy/server.js << 'EOF'
          const { createServer } = require('http')
          const { parse } = require('url')
          const next = require('next')
          
          const dev = process.env.NODE_ENV !== 'production'
          const hostname = process.env.HOSTNAME || 'localhost'
          const port = process.env.PORT || 3000
          
          const app = next({ dev, hostname, port })
          const handle = app.getRequestHandler()
          
          app.prepare().then(() => {
            createServer(async (req, res) => {
              try {
                const parsedUrl = parse(req.url, true)
                await handle(req, res, parsedUrl)
              } catch (err) {
                console.error('Error:', err)
                res.statusCode = 500
                res.end('Internal server error')
              }
            }).listen(port, (err) => {
              if (err) throw err
              console.log(`Ready on http://${hostname}:${port}`)
            })
          })
          EOF
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02329BEA6A474557B57CEE84C9F390A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_059495A5A3A74C59BCF5AA1299A87983 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F09229AF32A041B49D569529FFFA6F7F }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'cvgenie'
          package: .
          startup-command: 'node server.js'